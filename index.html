<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuSolver AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Noto Sans Bengali', 'Noto Sans Devanagari', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                705: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95',
              },
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', 'Noto Sans Devanagari', sans-serif;
      }
      
      /* Custom Animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .animate-slide-in-right {
        animation: slideInRight 0.4s ease-out forwards;
      }

      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.95) translateY(10px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      .animate-pop-in {
        animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0; /* Start hidden */
      }

      /* Stagger Delays */
      .delay-100 { animation-delay: 100ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }
      .delay-500 { animation-delay: 500ms; }

      /* Specular Light Sweep Animation */
      @keyframes lightSweep {
        0% {
          transform: translateX(-150%) skewX(-25deg);
        }
        35%, 100% {
          transform: translateX(150%) skewX(-25deg);
        }
      }
      .animate-light-sweep {
        position: relative;
        overflow: hidden;
      }
      .animate-light-sweep::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 255, 255, 0.0) 30%,
          rgba(255, 255, 255, 0.1) 45%,
          rgba(255, 255, 255, 0.22) 50%,
          rgba(255, 255, 255, 0.1) 55%,
          rgba(255, 255, 255, 0.0) 70%,
          transparent
        );
        animation: lightSweep 5.5s ease-in-out infinite;
        pointer-events: none;
      }

      /* Glowing Neon Border/Shadow Animation */
      @keyframes neonGlow {
        0%, 100% {
          border-color: rgba(99, 102, 241, 0.2);
          box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 
                      0 0 15px rgba(99, 102, 241, 0.05),
                      inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
        }
        50% {
          border-color: rgba(139, 92, 246, 0.45);
          box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 
                      0 0 25px rgba(139, 92, 246, 0.22),
                      inset 0 1px 0 0 rgba(255, 255, 255, 0.22);
        }
      }
      .animate-neon-glow {
        animation: neonGlow 6s ease-in-out infinite;
      }

      .liquid-glass-header {
        background: rgba(12, 12, 16, 0.45);
        backdrop-filter: blur(24px) saturate(190%);
        -webkit-backdrop-filter: blur(24px) saturate(190%);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
        animation: neonGlow 6s ease-in-out infinite;
      }
    </style>

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-zinc-950 text-zinc-50 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
